<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#edf7f2">
<title>A Little Gift 💗</title>
<style>
  :root{
    --mint:#8fc8b5;
    --deep:#31584f;
    --glass:rgba(255,255,255,.80);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17121a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  body{-webkit-tap-highlight-color:transparent}
  button,a{font:inherit}
  .page{
    position:fixed; inset:0; overflow:hidden;
    opacity:1; visibility:visible; pointer-events:auto;
    transition:opacity .45s ease, transform .45s ease;
    transform:scale(1);
  }
  .page.hidden{opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.025)}

  /* ---------- PAGE 1 ---------- */
  #page1{
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 15% 18%, rgba(255,255,255,.95) 0 5%, transparent 6%),
      radial-gradient(circle at 86% 14%, rgba(255,255,255,.75) 0 4%, transparent 5%),
      linear-gradient(145deg,#fffdf4 0%,#e8f4ee 48%,#e8f0fa 100%);
  }
  #page1::before{
    content:"";
    position:absolute; inset:-20%;
    background:
      radial-gradient(circle at 18% 35%, rgba(143,200,181,.24) 0 7%, transparent 8%),
      radial-gradient(circle at 82% 62%, rgba(166,190,225,.22) 0 9%, transparent 10%),
      radial-gradient(circle at 50% 92%, rgba(255,255,255,.78) 0 12%, transparent 13%);
    filter:blur(8px);
    animation:bgFloat 9s ease-in-out infinite alternate;
  }
  #page1::after{
    content:"♡  ✦  ♡  ✧  ♡  ✦  ♡  ✧  ♡";
    position:absolute;
    left:0;right:0;bottom:5vh;
    text-align:center;
    color:rgba(83,137,121,.32);
    font-size:22px;
    letter-spacing:9px;
    pointer-events:none;
  }
  @keyframes bgFloat{from{transform:translate3d(-1%,-1%,0) scale(1)}to{transform:translate3d(1%,1%,0) scale(1.04)}}

  .message{
    position:relative; z-index:10;
    width:min(79vw,350px);
    margin-top:1vh;
    text-align:center;
    padding:23px 18px 25px;
    border-radius:30px;
    background:rgba(255,255,255,.88);
    border:1px solid rgba(255,255,255,.98);
    box-shadow:0 18px 55px rgba(44,78,68,.16);
    backdrop-filter:blur(15px);
  }
  .message h1{
    margin:0 0 9px; color:#294b43;
    font-size:clamp(28px,7.5vw,40px); line-height:1.07; letter-spacing:-1px;
  }
  .message p{margin:0 0 18px;color:#5c716a;font-size:14px;line-height:1.45}
  .click-link{
    display:inline-block;color:#3d7b6c;text-decoration:none;font-size:22px;font-weight:850;
    border-bottom:3px solid #9ccfbe;padding:4px 5px 3px;
    animation:pulse 1.7s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}

  /* Cute kitten wall — multiple different photos, with one favorite repeated. */
  .kitten-wall{position:absolute;inset:0;z-index:3;pointer-events:none}
  .kitten-card{
    position:absolute;
    width:clamp(68px,19vw,104px);
    height:clamp(78px,22vw,116px);
    padding:5px;
    background:rgba(255,255,255,.94);
    border:1px solid rgba(255,255,255,.98);
    border-radius:20px;
    box-shadow:0 10px 26px rgba(54,92,82,.15);
    overflow:hidden;
    animation:floatKitten 5.2s ease-in-out infinite;
  }
  .kitten-card img{width:100%;height:100%;object-fit:cover;border-radius:15px;display:block}
  .kc1{left:3vw;top:6vh;transform:rotate(-9deg)}
  .kc2{right:3vw;top:6vh;transform:rotate(8deg);animation-delay:.6s}
  .kc3{left:2vw;top:31vh;transform:rotate(7deg);animation-delay:1.1s}
  .kc4{right:2vw;top:32vh;transform:rotate(-7deg);animation-delay:1.8s}
  .kc5{left:3vw;bottom:14vh;transform:rotate(-8deg);animation-delay:2.2s}
  .kc6{right:3vw;bottom:14vh;transform:rotate(8deg);animation-delay:2.8s}
  .kc7{left:15vw;bottom:4vh;transform:rotate(5deg);width:clamp(60px,16vw,92px);height:clamp(70px,18vw,104px);animation-delay:1.5s}
  .kc8{right:15vw;bottom:4vh;transform:rotate(-5deg);width:clamp(60px,16vw,92px);height:clamp(70px,18vw,104px);animation-delay:3.1s}
  @keyframes floatKitten{0%,100%{translate:0 0}50%{translate:0 -7px}}

  @media (max-width:380px){
    .message{width:77vw;padding:20px 15px 22px}
    .message h1{font-size:27px}
    .message p{font-size:13px}
    .kitten-card{width:62px;height:72px;border-radius:17px;padding:4px}
    .kitten-card img{border-radius:13px}
  }

  /* ---------- VIDEO PAGES ---------- */
  .video-page{background:#111}
  .video-bg{
    position:absolute;inset:0;
    display:grid;place-items:center;
    background:#111;
  }
  .video-bg video{
    width:100%;height:100%;
    object-fit:contain;
    display:block;
    background:#111;
  }
  .video-shade{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.14),transparent 20%,transparent 78%,rgba(0,0,0,.22));
  }

  .corner-photo{
    position:absolute;
    z-index:5;
    right:max(14px,env(safe-area-inset-right));
    bottom:max(18px,calc(env(safe-area-inset-bottom) + 18px));
    width:min(27vw,118px);
    aspect-ratio:1/1;
    border:3px solid rgba(255,255,255,.97);
    border-radius:20px;
    overflow:hidden;
    background:#fff;
    box-shadow:0 10px 30px rgba(0,0,0,.42);
    transform:rotate(2deg);
  }
  .corner-photo img{width:100%;height:100%;object-fit:cover;display:block}

  .next{
    position:absolute;
    z-index:6;
    left:max(16px,env(safe-area-inset-left));
    bottom:max(22px,calc(env(safe-area-inset-bottom) + 22px));
    border:0;
    border-radius:999px;
    padding:12px 17px;
    color:#31584f;
    background:rgba(255,255,255,.90);
    box-shadow:0 9px 28px rgba(0,0,0,.28);
    font-size:15px;
    font-weight:800;
    cursor:pointer;
  }
  .next .arrow{font-size:20px;vertical-align:-1px;margin-left:4px}
  .label{
    position:absolute;z-index:6;left:50%;top:max(18px,env(safe-area-inset-top));
    transform:translateX(-50%);
    color:#fff;background:rgba(0,0,0,.40);
    border:1px solid rgba(255,255,255,.14);
    padding:8px 13px;border-radius:999px;
    font-size:13px;font-weight:650;
    backdrop-filter:blur(8px);
    white-space:nowrap;
  }
  .knock-note{
    position:absolute;z-index:7;left:50%;top:58px;transform:translateX(-50%);
    color:#fff;background:rgba(0,0,0,.38);
    padding:7px 11px;border-radius:999px;
    font-size:12px;opacity:0;transition:opacity .3s;
    pointer-events:none;
  }
  .knock-note.show{opacity:1}

  .end-note{
    position:absolute;z-index:6;left:50%;top:max(18px,env(safe-area-inset-top));
    transform:translateX(-50%);
    color:#fff;background:rgba(0,0,0,.42);
    padding:8px 13px;border-radius:999px;font-size:13px;
    backdrop-filter:blur(8px);white-space:nowrap;
  }
  .replay{
    position:absolute;z-index:6;
    left:max(16px,env(safe-area-inset-left));
    bottom:max(22px,calc(env(safe-area-inset-bottom) + 22px));
    border:0;border-radius:999px;padding:12px 16px;
    background:rgba(255,255,255,.90);color:#31584f;font-weight:800;
    box-shadow:0 9px 28px rgba(0,0,0,.28);
  }

  /* ---------- KITTEN DECORATIONS ---------- */
  .kitten-float{
    position:absolute; z-index:4;
    width:clamp(64px,20vw,112px);
    aspect-ratio:1;
    object-fit:cover;
    border-radius:24px;
    box-shadow:0 10px 28px rgba(80,20,50,.20);
    border:3px solid rgba(255,255,255,.94);
    pointer-events:none;
    user-select:none;
    animation:floatKitten 4.8s ease-in-out infinite;
  }
  .k1{left:3vw;top:8vh;transform:rotate(-8deg);}
  .k2{right:4vw;top:11vh;transform:rotate(8deg);animation-delay:.7s;}
  .k3{left:2vw;bottom:13vh;transform:rotate(7deg);animation-delay:1.2s;}
  .k4{right:4vw;bottom:14vh;transform:rotate(-7deg);animation-delay:1.8s;}
  .k5{left:7vw;top:28vh;transform:rotate(-5deg);animation-delay:.9s;}
  .k6{right:7vw;top:31vh;transform:rotate(5deg);animation-delay:1.5s;}
  .video-page .kitten-float{width:clamp(52px,17vw,96px);border-radius:20px;opacity:.92;}
  @keyframes floatKitten{0%,100%{translate:0 0}50%{translate:0 -7px}}

  @media (min-width:700px){
    .message{margin-top:250px}
    .video-bg video{max-width:560px}
    .corner-photo{width:145px}
  }
</style>
</head>
<body>

<!-- PAGE 1: cute kitten wall + gift message -->
<section id="page1" class="page">
  <div class="kitten-wall" aria-hidden="true">
    <div class="kitten-card kc1"><img src="assets/kitten-new-1.jpg" alt=""></div>
    <div class="kitten-card kc2"><img src="assets/kitten-new-2.jpg" alt=""></div>
    <div class="kitten-card kc3"><img src="assets/kitten-new-3.jpg" alt=""></div>
    <div class="kitten-card kc4"><img src="assets/kitten-new-4.jpg" alt=""></div>
    <div class="kitten-card kc5"><img src="assets/kitten-new-5.jpg" alt=""></div>
    <div class="kitten-card kc6"><img src="assets/kitten-new-6.jpg" alt=""></div>
    <!-- Favorite kitten intentionally repeated -->
    <div class="kitten-card kc7"><img src="assets/kitten-new-6.jpg" alt=""></div>
    <div class="kitten-card kc8"><img src="assets/kitten-new-7.jpg" alt=""></div>
  </div>

  <div class="message">
    <h1>I have little gift for you Ma'am 💝</h1>
    <p>Just follow along… there's a tiny surprise waiting for you. 🥹✨</p>
    <a href="#" class="click-link" id="startBtn">click here Ma'am 👀</a>
  </div>

  <div class="corner-photo">
    <img src="assets/corner-photo.jpeg" alt="little photo">
  </div>
</section>

<!-- PAGE 2: window/door video + knock -->
<section id="page2" class="page video-page hidden">
  <div class="video-bg">
    <video id="doorVideo" playsinline preload="auto">
      <source src="assets/door-video.mp4" type="video/mp4">
    </video>
    <div class="video-shade"></div>
  </div>
  <div class="label">wait… who's there? 👀</div>
  <div id="knockNote" class="knock-note">knock knock… 🚪</div>

  <button class="next" id="toPage3">Go on <span class="arrow">→</span></button>

  <img class="kitten-float k5" src="assets/kitten-new-5.jpg" alt="cute kitten">
  <img class="kitten-float k2" src="assets/kitten-new-2.jpg" alt="cute kitten">

  <div class="corner-photo">
    <img src="assets/corner-photo.jpeg" alt="little photo">
  </div>
</section>

<!-- PAGE 3: child video -->
<section id="page3" class="page video-page hidden">
  <div class="video-bg">
    <video id="childVideo" playsinline preload="auto" muted>
      <source src="assets/child-video.mp4" type="video/mp4">
    </video>
    <div class="video-shade"></div>
  </div>
  <div class="label">okay… one more 👀💗</div>

  <button class="next" id="toPage4">Go next <span class="arrow">→</span></button>

  <img class="kitten-float k3" src="assets/kitten-new-3.jpg" alt="cute kitten">
  <img class="kitten-float k6" src="assets/kitten-new-6.jpg" alt="cute kitten">

  <div class="corner-photo">
    <img src="assets/corner-photo.jpeg" alt="little photo">
  </div>
</section>

<!-- PAGE 4: first video with its original audio -->
<section id="page4" class="page video-page hidden">
  <div class="video-bg">
    <video id="firstVideo" playsinline preload="auto">
      <source src="assets/first-video.mp4" type="video/mp4">
    </video>
    <div class="video-shade"></div>
  </div>
  <div class="end-note">for you 💗</div>

  <button class="replay" id="replay">↻ replay</button>

  <img class="kitten-float k1" src="assets/kitten-new-1.jpg" alt="cute kitten">
  <img class="kitten-float k4" src="assets/kitten-new-4.jpg" alt="cute kitten">

  <div class="corner-photo">
    <img src="assets/corner-photo.jpeg" alt="little photo">
  </div>
</section>

<!-- PAGE 5: final goodbye -->
<section id="page5" class="page hidden" style="display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#fffdf4 0%,#e8f4ee 48%,#e8f0fa 100%);">
  <div style="position:relative;z-index:2;padding:26px 28px;border-radius:28px;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.98);box-shadow:0 18px 55px rgba(44,78,68,.16);backdrop-filter:blur(15px);text-align:center;">
    <div style="font-size:clamp(30px,8vw,44px);font-weight:850;line-height:1.08;letter-spacing:-1px;color:#31584f;">Bye Doctor Sahiba</div>
  </div>
</section>

<audio id="knockAudio" preload="auto">
  <source src="assets/door-knock.wav" type="audio/wav">
</audio>

<script>
  const pages = {
    1: document.getElementById('page1'),
    2: document.getElementById('page2'),
    3: document.getElementById('page3'),
    4: document.getElementById('page4'),
    5: document.getElementById('page5')
  };

  const doorVideo = document.getElementById('doorVideo');
  const childVideo = document.getElementById('childVideo');
  const firstVideo = document.getElementById('firstVideo');
  const knockAudio = document.getElementById('knockAudio');
  const knockNote = document.getElementById('knockNote');

  let current = 1;

  function stopAllMedia(){
    [doorVideo, childVideo, firstVideo].forEach(v => {
      v.pause();
      v.currentTime = 0;
      v.muted = false;
    });
    // The child video should remain silent.
    childVideo.muted = true;
    knockAudio.pause();
    knockAudio.currentTime = 0;
  }

  function showPage(n){
    Object.entries(pages).forEach(([key,el])=>{
      const active = Number(key) === n;
      el.classList.toggle('hidden', !active);
    });
    current = n;
  }

  async function page2Start(){
    stopAllMedia();
    showPage(2);

    // The attached window/door video is shown silently and a separate
    // door-knock sound is played when the user taps "click here".
    doorVideo.muted = true;
    doorVideo.currentTime = 0;
    knockAudio.currentTime = 0;

    try { await doorVideo.play(); } catch(e) {}
    try { await knockAudio.play(); } catch(e) {}

    knockNote.classList.add('show');
    setTimeout(()=>knockNote.classList.remove('show'), 1500);
  }

  async function page3Start(){
    stopAllMedia();
    showPage(3);
    childVideo.currentTime = 0;
    childVideo.muted = true;
    try { await childVideo.play(); } catch(e) {}
  }

  async function page4Start(){
    stopAllMedia();
    showPage(4);
    firstVideo.currentTime = 0;
    // Original audio of the first attached video plays with the video.
    try { await firstVideo.play(); } catch(e) {}
  }

  document.getElementById('startBtn').addEventListener('click', e=>{
    e.preventDefault();
    page2Start();
  });

  document.getElementById('toPage3').addEventListener('click', e=>{
    e.stopPropagation();
    page3Start();
  });

  document.getElementById('toPage4').addEventListener('click', e=>{
    e.stopPropagation();
    page4Start();
  });

  firstVideo.addEventListener('ended', ()=>{
    stopAllMedia();
    showPage(5);
  });

  document.getElementById('replay').addEventListener('click', async e=>{
    e.stopPropagation();
    firstVideo.currentTime = 0;
    try { await firstVideo.play(); } catch(e) {}
  });

  // A tap anywhere on a video page can retry playback if a browser paused it.
  [pages[2],pages[3],pages[4]].forEach((page)=>{
    page.addEventListener('click', async e=>{
      if(e.target.closest('button')) return;
      if(current === 2){
        try { await doorVideo.play(); } catch(e) {}
        try { await knockAudio.play(); } catch(e) {}
      }
      if(current === 3){
        childVideo.muted = true;
        try { await childVideo.play(); } catch(e) {}
      }
      if(current === 4){
        try { await firstVideo.play(); } catch(e) {}
      }
    });
  });

  // Keep the sequence simple even if someone uses the browser back button.
  window.addEventListener('popstate', ()=>{
    stopAllMedia();
    showPage(1);
  });
</script>
</body>
</html>
